<!DOCTYPE html>
<html lang="da">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Claras Cocktail App</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f6f1ff;
    max-width:900px;
    margin:auto;
    padding:20px;
}

h1{
    color:#7c3aed;
}

input[type="text"]{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #ddd;
    margin-bottom:20px;
    box-sizing:border-box;
}

details{
    background:white;
    margin-bottom:15px;
    border-radius:12px;
    padding:15px;
}

summary{
    font-weight:bold;
    cursor:pointer;
    font-size:18px;
}

.undergruppe{
    margin-left:20px;
    margin-top:10px;
    background:#eef7f4;
    border-radius:10px;
    padding:10px;
}

label{
    display:block;
    margin:6px 0;
}

</style>
</head>
