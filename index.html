<!DOCTYPE html>
<html lang="da">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Claras Cocktail App</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f6f1ff;
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

h1 {
    color: #7c3aed;
}

.kategori {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
}

label {
    display: block;
    margin: 8px 0;
}

</style>

</head>

<body>

<h1>🍹 Claras Cocktail App</h1>

<div class="kategori">
<h2>Spiritus</h2>

<label>
<input type="checkbox">
Gin
</label>

<label>
<input type="checkbox">
Vodka
</label>

<label>
<input type="checkbox">
Hvid Rom
</label>

<label>
<input type="checkbox">
Spiced Rom
</label>

</div>

<div class="kategori">
<h2>Likører</h2>

<label>
<input type="checkbox">
Aperol
</label>

<label>
<input type="checkbox">
Triple Sec
</label>

</div>

<div class="kategori">
<h2>Mixere</h2>

<label>
<input type="checkbox">
Sprite
</label>

<label>
<input type="checkbox">
Cola
</label>

<label>
<input type="checkbox">
Tonic
</label>

</div>

<div class="kategori">
<h2>Pantry</h2>

<label>
<input type="checkbox">
Citronsaft
</label>

<label>
<input type="checkbox">
Limesaft
</label>

<label>
<input type="checkbox">
Ananasjuice
</label>

</div>

<script>

const checkboxes = document.querySelectorAll('input[type="checkbox"]');

checkboxes.forEach((checkbox, index) => {

    const gemt = localStorage.getItem('lager_' + index);

    if (gemt === 'true') {
        checkbox.checked = true;
    }

    checkbox.addEventListener('change', () => {
        localStorage.setItem(
            'lager_' + index,
            checkbox.checked
        );
    });

});

</script>

</body>

</html>
